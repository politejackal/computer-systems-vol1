        name: "Flip the Switch"
      - id: hexed
        name: "Hexed"
  - id: summoning-ritual
    name: "The Summoning Ritual: Compilation"
  - id: bare-metal
    name: "Bare Metal: The CPU"
  - id: the-throne
    name: "The Throne: The Kernel"
